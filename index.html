<!DOCTYPE html>
<html lang="kk" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Малды тікелей иесінен алыңыз — Төрт түлік">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#fff;--surface:#fff;--soft:#eaf4f5;--ink:#12212b;--mute:#5b6b75;--line:#dde6ea;--acc:#0f5c63;--onacc:#fff;--sun:#e8a91f;--head:#0f5c63;--hink:#fff;--navy:#0a1a3a;box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;padding-bottom:96px;background:var(--bg);color:var(--ink);font:16px/1.5 "PT Sans",system-ui,sans-serif;transition:background .3s,color .3s}
h1,h2,h3{font-family:"PT Serif",Georgia,serif;margin:0;line-height:1.15}
[hidden]{display:none!important}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 18px}
.top{background:var(--head);color:var(--hink);padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.topin{display:flex;align-items:center;gap:10px;padding:12px 18px;max-width:1000px;margin:0 auto}
.brand{font:700 25px "PT Serif",serif;color:var(--hink)}
.tools{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang{display:flex;border:2px solid var(--hink);border-radius:99px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--hink);padding:4px 12px;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--hink);color:var(--head)}
.sun{width:38px;height:38px;border-radius:50%;border:2px solid var(--hink);background:transparent;color:var(--hink);display:grid;place-items:center;cursor:pointer;padding:0}
.sun svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:center;padding:14px 0 6px}
.hero h1{font-size:clamp(28px,6vw,46px)}
.hero p{color:var(--mute);margin:10px 0 0;max-width:32em}
.hero svg{width:100%;height:auto;color:var(--acc)}
@media(max-width:640px){.hero{grid-template-columns:1fr}.hero svg{max-width:280px}}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 16px;font-weight:700;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.filters{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 6px}
.filters label,.fld{display:flex;flex-direction:column;font-size:14px;color:var(--mute);gap:4px}
select,input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:150px}
.count{color:var(--mute);margin:6px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:100px;background:var(--soft);color:var(--acc);display:flex;align-items:center;justify-content:center;position:relative}
.thumb svg{width:58px;height:58px}
.thumb.has{height:170px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.heart{z-index:2}
.desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.heart{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:#c0392b;font-size:20px;line-height:1;cursor:pointer}
.heart[aria-pressed="true"]{background:#c0392b;border-color:#c0392b;color:#fff}
.body{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.price{font:700 22px "PT Serif",serif;color:var(--acc)}
.meta{color:var(--mute);font-size:14px}
.facts{display:flex;gap:6px}
.facts span{background:var(--soft);border-radius:6px;padding:2px 8px;font-size:13px}
.btn{background:var(--acc);color:var(--onacc);border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.card .btn{margin-top:auto}
.empty{grid-column:1/-1;text-align:center;padding:34px 16px;color:var(--mute);border:2px dashed var(--line);border-radius:14px}
.panel{padding:26px 0}.panel .empty{margin-top:14px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:flex-end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
nav.bar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0;color:var(--mute);font-size:12px;cursor:pointer}
nav.bar .ic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s}
nav.bar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.bar button[aria-current="page"]{color:var(--acc);font-weight:700}
nav.bar button[aria-current="page"] .ic{background:var(--acc);color:var(--onacc)}
nav.bar .plus .ic{width:50px;height:50px;border-radius:50%;background:var(--sun);color:#0a1a3a;margin-top:-20px;box-shadow:0 3px 8px rgba(0,0,0,.25)}

.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.back{background:none;border:0;color:var(--acc);font-weight:700;cursor:pointer;padding:0 0 10px}
.aform{display:grid;gap:14px;max-width:640px;margin-top:14px}
.aform input,.aform select,.aform textarea{min-width:0;width:100%}
textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;resize:vertical;min-height:84px}
.photo{border:2px dashed var(--acc);border-radius:14px;min-height:190px;display:grid;place-items:center;cursor:pointer;overflow:hidden;background:var(--soft);color:var(--acc);text-align:center;padding:14px}
.photo small{color:var(--mute)}
.photo img{width:100%;max-height:340px;object-fit:cover;border-radius:10px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.chk input{width:auto;min-width:0}
nav.bar .plus[aria-current="page"] .ic{background:var(--sun);color:#0a1a3a}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:var(--onacc);padding:9px 18px;border-radius:8px;display:none;z-index:30}
.hero{grid-template-columns:1fr}
.cats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.cat{width:88px;height:88px;border-radius:14px;border:2px solid var(--acc);background:var(--surface);color:var(--acc);font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.cat svg{width:34px;height:34px}
.cat:active{background:var(--acc);color:var(--onacc)}
.sbar{display:flex;justify-content:center;gap:8px;margin:16px auto;max-width:520px}
.sbar input{flex:1}
.thumb,.thumb.has{height:auto;aspect-ratio:4/3}
.thumb img{object-fit:contain}
.card{cursor:pointer}
.btn.green{background:#1f8a4c;color:#fff}
.dphoto{background:var(--soft);border-radius:14px;display:grid;place-items:center;margin:8px 0 14px;overflow:hidden;color:var(--acc)}
.dphoto img{width:100%;max-height:480px;object-fit:contain;display:block}
.dphoto svg{width:90px;height:90px;margin:40px}
.det{max-width:640px}
.seller{background:var(--soft);border-radius:10px;padding:12px 14px;margin:14px 0;line-height:1.8}
.seller a{color:var(--acc);font-weight:700}
.clist{display:grid;gap:8px;margin-top:12px}
.citem{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer}
.msgs{display:flex;flex-direction:column;gap:8px;margin:14px 0;min-height:120px}
.msg{align-self:flex-end;background:var(--acc);color:var(--onacc);padding:8px 12px;border-radius:12px 12px 2px 12px;max-width:80%}
.mform{display:flex;gap:8px}.mform input{flex:1}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;max-width:420px}
.gbtn,.sopen{min-height:54px;width:100%;border:2px solid var(--sun);border-radius:10px;background:var(--surface);color:var(--ink);display:flex;flex-direction:row;align-items:center;justify-content:center;gap:8px;font:700 clamp(12px,3.4vw,15px) "PT Serif",serif;cursor:pointer;padding:6px 8px;line-height:1.15;overflow-wrap:anywhere}
.gbtn:active{transform:scale(.98)}
.sopen{grid-column:1/3}
.sopen svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sopen:active{transform:scale(.98)}
.sform{margin-bottom:10px}
.em{font-size:54px;line-height:1;margin:28px}.cat{width:96px;height:96px}.cat .em{font-size:34px;margin:0}
.srow{display:flex;gap:8px;align-items:center}.srow select{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:var(--soft);border-radius:12px;padding:12px;text-align:center;font-size:13px}.stat b{display:block;font:700 24px "PT Serif",serif;color:var(--acc)}
.avatar{width:72px;height:72px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:700 30px "PT Serif",serif}
.ph{display:flex;align-items:center;gap:14px}
.mrow{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px;flex-wrap:wrap}.mrow span{flex:1;min-width:140px}.mrow .btn{padding:6px 10px}
.sold{opacity:.6}.tag{background:var(--sun);color:#0a1a3a;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700;font-style:normal}
.auth{max-width:420px;margin:7vh auto;border-radius:22px;overflow:hidden;box-shadow:0 10px 34px rgba(15,92,99,.2);border:1px solid var(--line);background:var(--surface)}
.ahead{background:linear-gradient(135deg,#0f5c63,#1fa0a8);color:#fff;text-align:center;padding:30px 20px}.ahead h2{color:#fff}.ahead p{margin:8px 0 0;opacity:.92;font-size:15px}
.alogo{font-size:46px;width:88px;height:88px;margin:0 auto 12px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.abody{padding:22px;display:grid;gap:12px}.abody .aform{margin:0}.btn.big{width:100%;padding:13px;font-size:17px;border-radius:12px}.abody .back{padding:4px 0;text-align:center}
.ctr{min-height:60vh;display:grid;align-content:center;gap:12px;width:min(320px,100%);margin:0 auto}
.av{position:relative;width:120px;height:120px;margin:14px auto 8px}.avc{width:120px;height:120px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font:700 46px "PT Serif",serif;overflow:hidden}.avc img{width:100%;height:100%;object-fit:cover}
.cam{position:absolute;right:0;bottom:0;width:38px;height:38px;border-radius:50%;background:var(--sun);color:#0a1a3a;display:grid;place-items:center;border:3px solid var(--bg);cursor:pointer}.cam svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.ctx{text-align:center}.set{display:grid;gap:8px;margin:10px 0 20px;max-width:640px}
.set .it{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 16px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.seg{display:flex;gap:6px}.seg button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:3px 14px;font-weight:700;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
.demo{background:var(--soft);border:1px dashed var(--acc);border-radius:10px;padding:10px 12px;font-size:14px}
.cat{width:auto;min-width:110px;height:52px;padding:0 16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card .body{padding:8px 10px;gap:3px}.card h3{font-size:14px}.card .price{font-size:16px}.card .meta{font-size:12px}.card .btn{padding:7px 8px;font-size:13px}.heart{width:30px;height:30px;font-size:16px;top:6px;right:6px}.thumb svg{width:44px;height:44px}
.robot{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--soft);font-weight:700;cursor:pointer;text-align:left;color:var(--ink)}
.rbox{width:26px;height:26px;border:3px solid var(--mute);border-radius:6px;display:grid;place-items:center;flex:none;background:var(--surface)}
.robot.busy .rbox{border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
.robot.ok .rbox{background:#1f8a4c;border-color:#1f8a4c;color:#fff}.robot.ok .rbox:after{content:"✓"}@keyframes sp{to{transform:rotate(360deg)}}
.clist{gap:0;margin-top:8px}.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 4px;cursor:pointer;color:var(--ink)}
.cmid{flex:1;min-width:0;display:flex;flex-direction:column}.cmid .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cav{width:46px;height:46px;border-radius:50%;color:#fff;display:grid;place-items:center;font:700 19px "PT Serif",serif;flex:none}
.cwrap{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#eceefb;height:calc(100dvh - 170px);min-height:380px}
.chead{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#4338ca;color:#fff}.chead .meta{color:#dfe2ff}.cbk{background:none;border:0;color:#fff;font-size:22px;cursor:pointer}
.ccall{color:#fff;display:grid;place-items:center}.ccall svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round}
.cmsgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.bub{align-self:flex-end;max-width:80%;background:#d6dafd;color:#1b1f3b;border-radius:12px 12px 2px 12px;padding:6px 10px 4px;overflow-wrap:anywhere}.tm{display:block;text-align:right;font-size:11px;color:#6b7280;margin-top:2px}
.cin{display:flex;gap:8px;padding:8px;background:#f5f6ff}.cin input{flex:1;border-radius:99px;padding:10px 16px;color:#12212b}
.csend{width:44px;height:44px;border-radius:50%;border:0;background:#4338ca;color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.csend svg{width:20px;height:20px;fill:currentColor}
.err{background:#fdecea;color:#b3261e;border-radius:8px;padding:8px 12px;font-size:14px}
.pw{display:flex;position:relative}.pw input{flex:1;padding-right:44px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mute);cursor:pointer;padding:6px}.eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}
.sb{display:block;height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.sb u{display:block;height:100%;width:0;background:#c0392b;transition:.2s}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle}
.pgrid{display:flex;gap:10px;flex-wrap:wrap}.pt{position:relative;width:84px;height:84px}.pt img{width:100%;height:100%;object-fit:cover;border-radius:10px}.pt button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#c0392b;color:#fff;cursor:pointer}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin:-4px 0 12px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer;flex:none}.thumbs img.on{border-color:var(--acc)}
#gm{cursor:pointer}

.sc{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(#a9d8ec 0 56%,#d8c284 56% 68%,#8fa24f 68%)}
.sc.home{background:linear-gradient(#f6d9b6 0 60%,#d9b99a 60%)}
.sc b{font-size:clamp(44px,9vw,64px);font-weight:400;margin-top:18%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.25))}
.sun2{position:absolute;top:12%;right:14%;width:22%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#fff6c4,#ffd36b 70%);opacity:.9}
.dphoto .sc{position:relative;width:100%;aspect-ratio:4/3}.dphoto .sc b{font-size:110px}
.dtext{line-height:1.6;max-width:36em}
.card{transition:transform .15s}.card:active{transform:scale(.985)}

#splash{position:fixed;inset:0;z-index:100;display:grid;place-content:center;justify-items:center;gap:18px;background:#0f5c63;color:#fff;transition:opacity .5s,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
#splash .sl{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center}
#splash .sl svg{width:58px;height:58px;color:#fff}
#splash .sn{font:700 34px "PT Serif",Georgia,serif}
#splash .sbar2{width:160px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);overflow:hidden}
#splash .sbar2 i{display:block;height:100%;width:0;background:#e8a91f;animation:ld .5s ease-out forwards}
@keyframes ld{to{width:100%}}
@media(prefers-reduced-motion:reduce){#splash .sbar2 i{animation-duration:.01s}#splash{transition:none}}
.bub.in{align-self:flex-start;background:#fff;border-radius:12px 12px 12px 2px}
#callui{position:fixed;inset:0;z-index:90;background:rgba(10,26,58,.95);color:#fff;display:grid;place-content:center;justify-items:center;gap:16px;text-align:center}#callui .sn2{font:700 30px "PT Serif",serif}#cstat{opacity:.85}.cbtns{display:flex;gap:18px}.cbtns .btn{width:68px;height:68px;border-radius:50%;font-size:26px;padding:0}
.btn.red{background:#c0392b;color:#fff}.facts{flex-wrap:wrap}.cb{display:flex;gap:6px;margin-top:auto}.cb .btn{flex:1;margin-top:0;text-align:center;text-decoration:none;padding:7px 4px;font-size:13px}.dcb{margin:14px 0 10px}.dcb .btn{padding:12px;font-size:16px}
.ftc{text-align:center;margin:26px 0 6px;color:var(--mute);font-size:13px;word-break:break-word}
</style>
</head>
<body>
<div id="splash" role="status" aria-label="Жүктелуде"><div class="sl"><svg aria-hidden="true"><use href="#horn"/></svg></div><div class="sn">Төрт түлік</div><div class="sbar2"><i></i></div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="horn" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round"><path d="M50 62c-4-14-22-18-30-8-8 11 2 26 14 22 9-3 8-15 1-16"/><path d="M50 62c4-14 22-18 30-8 8 11-2 26-14 22-9-3-8-15-1-16"/><path d="M50 62v26"/></g></symbol></svg>
<header class="top"><div class="topin"><div class="brand">Төрт түлік</div><div class="tools"><div class="lang" id="lang"><button data-l="kk">Қаз</button><button data-l="ru">Рус</button></div></div></div></header>
<div class="wrap">

<div id="v-home">
<div class="groups" id="groups"><button type="button" class="gbtn" data-g="pet"><span data-i18n="pets"></span></button><button type="button" class="gbtn" data-g="field"><span data-i18n="field"></span></button><button type="button" class="sopen" id="sopen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span data-i18n="search"></span></button></div>
<main class="grid" id="grid"></main>
</div>

<section class="panel" id="v-chat" hidden><div id="chatbox"></div></section>
<section class="panel" id="v-dala" hidden><button type="button" class="back" id="xback" data-i18n="back"></button><h2 id="dtitle"></h2><div class="cats" id="cats"></div></section>
<section class="panel" id="v-srch" hidden>
<button type="button" class="back" id="sback" data-i18n="back"></button>
<h2 data-i18n="srchT"></h2>
<div class="aform sform">
<div class="row"><label class="fld"><span data-i18n="ftype"></span><select id="stype"></select></label><label class="fld"><span data-i18n="region"></span><select id="sreg"></select></label></div>
<label class="fld"><span data-i18n="dis"></span><select id="sdis"></select></label>
